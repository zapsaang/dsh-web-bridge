# Scaffold checks do not execute native/third-party dependency build scripts.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false

# The pinned DSH rc.2 peers are newer than pnpm's default 1-day release-age
# window. Peers are exact (no ranges) and the lockfile carries integrity
# hashes, so exclude only the DSH scope and its two pinned companions.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh*'
  - '@deepseek-ai/cordis'
  - '@deepseek-ai/schemastery'
