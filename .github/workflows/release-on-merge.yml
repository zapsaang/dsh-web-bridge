name: Release on merge

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: npm-package-release
  cancel-in-progress: false

jobs:
  tag-and-publish:
    if: github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'chore/sync-dsh-') || contains(github.event.pull_request.labels.*.name, 'automated-pr'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Extract target version from package.json
        id: version
        run: |
          ver=$(node -p 'JSON.parse(fs.readFileSync("package.json")).version')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Target version to release: $ver"

      - name: Check if tag already exists
        id: check_tag
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v${VER}" >/dev/null 2>&1; then
            echo "Tag v${VER} already exists. Skipping release trigger."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag commit on main and trigger publish.yml
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.version.outputs.version }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VER}" -m "${VER}"
          git push origin "v${VER}"

          gh workflow run publish.yml \
            --ref main \
            -f expected_version="${VER}" \
            -f publish=true

          gh pr comment "$PR_NUM" \
            --body "🚀 **版本 \`${VER}\` 已自动打标并触发发布！**\n\n已推送标签 \`v${VER}\`，并启动了发布工作流 [publish.yml](https://github.com/${{ github.repository }}/actions/workflows/publish.yml)。"
