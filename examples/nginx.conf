# Deployment example: Nginx + HTTPS + access authentication + Unix socket.
#
# Repository-only file: it is NOT part of the npm tarball. Copy it into
# /etc/nginx/conf.d/ (or sites-available) and replace the placeholders:
#   - dsh.example.com and the certificate paths
#   - /run/dsh-web/session-bridge.sock if your socketPath differs
#   - the authentication mechanism (Basic below, or the auth_request/OIDC block)
#
# Requirements: nginx >= 1.13.6 (HTTP/1.1 upstream over a Unix domain socket).
# `scripts/check-examples.mjs` statically checks this file in CI; it does not run
# `nginx -t`, so validate the copy on the deployment host.

# http context: map an Upgrade request to the correct Connection value.
map $http_upgrade $dsh_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dsh_bridge {
    server unix:/run/dsh-web/session-bridge.sock:;
}

server {
    listen 443 ssl;
    server_name dsh.example.com;

    ssl_certificate     /etc/ssl/dsh/fullchain.pem;
    ssl_certificate_key /etc/ssl/dsh/privkey.pem;

    client_max_body_size 0;      # DSH enforces its own maxRequestBodyBytes
    client_body_timeout  1h;

    # --- External authentication: enable exactly one mechanism ---
    auth_basic           "DSH";
    auth_basic_user_file /etc/nginx/dsh.htpasswd;

    # OIDC alternative via oauth2-proxy (disable auth_basic above):
    # auth_request /oauth2/auth;
    # auth_request_set $auth_user $upstream_http_x_auth_request_user;
    # location = /oauth2/auth {
    #     internal;
    #     proxy_pass http://127.0.0.1:4180/oauth2/auth;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header X-Original-URI $request_uri;
    # }

    location / {
        proxy_pass http://dsh_bridge;
        proxy_http_version 1.1;
        # Preserve the client's exact Host, including an explicit port, so the
        # bridge authority list and the DSH Host fence see the same value.
        proxy_set_header Host $http_host;
        # Never forward access-layer credentials. The bridge also strips
        # Authorization on the request direction; this is defense in depth.
        proxy_set_header Authorization "";
        # WebSocket upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dsh_connection_upgrade;
        # SSE and other streaming responses: no buffering, no caching.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
