# /etc/tmpfiles.d/dsh-web.conf
#
# Exactly ONE active directive for /run/dsh-web. The strict line below is the
# default (socketAccess omitted). The two group lines are commented out and
# mutually exclusive with the strict line and with each other: enable at most
# one mode for this path, and never let a second unit or tmpfiles line manage
# the same path while a cooperating instance may be alive.
#
# Default: strict mode. Private directory owned by the dsh user; socket 0600.
d /run/dsh-web 0700 dsh dsh -

# Group mode, 02710 (preferred alternative): setgid directory, group may
# traverse but not list, no group write, no others. The socket is created 0660
# and inherits this directory's GID; the lock stays 0600. Requires the bridge
# config to opt in with `socketAccess: group` and a matching owner/group/path
# from this same line as the single configuration owner.
# d /run/dsh-web 02710 dsh dsh-bridge -

# Group mode, 02750 (discovery alternative): same trust and socket contract as
# 02710, but the group may also list the directory. Use only when listing is
# actually needed.
# d /run/dsh-web 02750 dsh dsh-bridge -
